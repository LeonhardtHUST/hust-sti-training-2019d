[platformio]
; src_dir 设为项目根，让 app/ 下的源码与 Core/Src 一样无条件参与编译，
; 并继承 build_src_flags 的 -Werror；参与编译的文件由下方白名单决定。
src_dir = .
include_dir = Core/Inc
boards_dir = boards

[env:genericSTM32G474VE]
platform = ststm32@20.0.0
platform_packages =
  platformio/framework-stm32cubeg4@1.6.3
  platformio/toolchain-gccarmnoneeabi@1.70201.0
  platformio/tool-ldscripts-ststm32@0.3.0
  platformio/tool-openocd@3.1200.7
board = genericSTM32G474VE
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
; 白名单是必需的：src_dir = . 下若用 +<*>，docs/、node_modules/ 里的 .c 也会进构建。
; 排除项必须写全相对路径，写成 -<system_stm32g4xx.c> 在 src_dir = . 下不生效。
; +<app/src/*> 递归收进子目录；Core/Src 下既有 8 个业务模块仍在原位，本次不迁移。
build_src_filter = +<Core/Src/*> -<Core/Src/system_stm32g4xx.c> +<app/src/*>
build_src_flags =
  -std=c11
  -Wall
  -Wextra
  -Werror
; 链接期可见性：分段 + gc 减小体积，打印 Flash/RAM 用量并产出 map 便于查段与符号。
; 仅把严格告警施加于工程源码（上面的 build_src_flags），HAL/CMSIS 用包自身选项。
; G474 是 Cortex-M4F（单精度 FPv4-SP），这两行必须成对出现；放全局 build_flags
; 才能同时作用于工程源码与 framework 的 HAL/CMSIS。不给 -mfloat-abi=hard 时
; PIO 按软浮点编译，FPU 全程闲置、浮点运算走 libgcc 软件库。
; -Iapp/inc 用相对路径；写成 -I${PROJECT_DIR}/app/inc 会被拼成畸形路径（上游模板实测）。
build_flags =
  -mfpu=fpv4-sp-d16
  -mfloat-abi=hard
  -Iapp/inc
  -fdata-sections
  -ffunction-sections
  -Wl,--gc-sections
  -Wl,--print-memory-usage
  -Wl,-Map=${BUILD_DIR}/firmware.map
; 已开启 -Werror：存量告警已清零并经 L3 复核（2026-11-04）。
; 先在 /tmp 等价副本给 build_src_flags 追加 -Werror 跑 pio run，结论为零告警、
; SUCCESS（16.73 s）后才落地；仅施加于工程源码，HAL/CMSIS 用包自身选项。
; 使用 printf("%f") 时另加 -Wl,-u,_printf_float；newlib-nano 默认不含浮点格式化。
; 上面两个浮点 flag 只进 CCFLAGS（ParseFlags 只把 -Wl, 项放进 LINKFLAGS），故用
; extra_script 把同一对 flag 补进 ASFLAGS / LINKFLAGS；缺了它会在链接期报
; "xxx.o uses VFP register arguments, firmware.elf does not"。pre: 前缀不是
; 链接成功的前提，只是书写习惯。
extra_scripts = pre:scripts/pio-hard-fpu.py
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
